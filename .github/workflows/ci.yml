name: CI and release

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write  # publish releases

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: sudo apt-get update -q && sudo apt-get install -yq ffmpeg
      - run: pip install pytest
      - run: python -m pytest -q

  real-plex:
    # End-to-end against a real Plex Media Server in Docker, with a small
    # generated library. No Plex account: the server lets the runner in via
    # ALLOWED_NETWORKS; subtitle downloads aren't tested here.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update -q && sudo apt-get install -yq ffmpeg
      - run: pip install pytest
      - name: Build test library
        run: ./tests/realplex/make_library.sh /tmp/media
      - name: Start Plex Media Server
        run: |
          docker run -d --name plex --network host \
            -e TZ=UTC -e ALLOWED_NETWORKS=127.0.0.0/8,172.16.0.0/12,10.0.0.0/8 \
            -e PLEX_UID=$(id -u) -e PLEX_GID=$(id -g) \
            -v /tmp/plexconfig:/config -v /tmp/media:/data plexinc/pms-docker:latest
      - name: Create libraries and wait for the scan
        run: python tests/realplex/setup_plex.py
      - name: Run dualsubs against it
        env:
          REAL_PLEX_URL: http://127.0.0.1:32400
          REAL_PLEX_PATH_MAP: /data=/tmp/media
        run: python -m pytest -v tests/realplex
      - name: Explore Plex behaviour (informational)
        if: always()
        continue-on-error: true
        env:
          REAL_PLEX_URL: http://127.0.0.1:32400
        run: python tests/realplex/explore.py
      - name: Show what Plex returned
        if: always()
        run: |
          echo "== uploaded track labels =="; cat /tmp/plex-artifacts/uploaded-track-labels.txt || true
          echo; echo "== dualsubs output =="; cat /tmp/plex-artifacts/dualsubs-output.txt || true
          echo "== an uploaded track =="; head -12 /tmp/plex-artifacts/uploaded-track-*.srt || true
          echo "== lab placeholder on real Plex with a simulated TV =="; cat /tmp/plex-artifacts/lab-placeholder-output.txt || true
          echo "== subtitle streams as Plex reports them =="
          grep -ho '<Stream [^>]*streamType="3"[^>]*>' /tmp/plex-artifacts/item-*.xml || true
      - name: Plex log on failure
        if: failure()
        run: docker logs plex 2>&1 | tail -80; ls -la /tmp/plexconfig || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: real-plex-results
          path: /tmp/plex-artifacts

  release:
    # Builds the single-file `dualsubs` and publishes it:
    #  - "edge": rolling pre-release from every push to main
    #  - "vX.Y.Z": a normal release the first time a new version reaches main
    #    (this is what .../releases/latest/download/dualsubs serves)
    needs: [test, real-plex]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"  # build with the oldest supported Python
      - run: ./scripts/build-pyz.sh
      - name: Smoke test
        run: ./dist/dualsubs --version && ./dist/dualsubs --help >/dev/null
      - name: Publish edge build
        run: |
          git tag -f edge && git push -f origin edge
          notes="Rolling build of main at ${GITHUB_SHA::7}. For a stable version use the latest release."
          gh release view edge >/dev/null 2>&1 \
            || gh release create edge --prerelease --title "Edge (latest main)" --notes "$notes"
          gh release edit edge --notes "$notes"
          gh release upload edge dist/dualsubs --clobber
      - name: Publish version release
        run: |
          version=$(python3 -c "import re;print(re.search(r'__version__ = \"(.+?)\"', open('dualsubs/__init__.py').read()).group(1))")
          if gh release view "v$version" >/dev/null 2>&1; then
            echo "v$version already released"
          else
            gh release create "v$version" dist/dualsubs --target "$GITHUB_SHA" --latest \
              --title "dualsubs $version" --generate-notes
          fi

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dualsubs"
dynamic = ["version"]
description = "Add bilingual (dual-language) subtitle tracks to your Plex library"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = []  # standard library only

[project.scripts]
dualsubs = "dualsubs.cli:main"

[tool.setuptools.dynamic]
version = { attr = "dualsubs.__version__" }

[tool.setuptools.packages.find]
include = ["dualsubs*"]
